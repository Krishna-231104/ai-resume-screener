name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and push server image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ai-resume-server:$IMAGE_TAG ./server
          docker push $ECR_REGISTRY/ai-resume-server:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ai-resume-server:$IMAGE_TAG $ECR_REGISTRY/ai-resume-server:latest
          docker push $ECR_REGISTRY/ai-resume-server:latest
      
      - name: Build and push client image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ai-resume-client:$IMAGE_TAG ./client
          docker push $ECR_REGISTRY/ai-resume-client:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ai-resume-client:$IMAGE_TAG $ECR_REGISTRY/ai-resume-client:latest
          docker push $ECR_REGISTRY/ai-resume-client:latest
      
      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws/ecs-task-definition.json
          container-name: ai-resume-server
          image: ${{ steps.login-ecr.outputs.registry }}/ai-resume-server:${{ github.sha }}
      
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ai-resume-service
          cluster: ai-resume-cluster
          wait-for-service-stability: true
      
      - name: Send notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment $STATUS"
